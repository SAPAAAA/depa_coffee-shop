services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    ports:
      - 5173:5173
    volumes:
      - ./web:/app:Z
    networks:
      - coffee_shop_network
    env_file:
      - ./web/.env.dev
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173/"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: npm run dev
  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    ports:
      - 3000:3000
    volumes:
      - ./api:/app:Z
    networks:
      - coffee_shop_network
    env_file:
      - ./api/.env.dev
    depends_on:
      - db
    command: npm run dev
  db:
    image: postgres:18-alpine
    ports:
      - 5432:5432
    volumes:
      - ./db/queries:/docker-entrypoint-initdb.d:Z
    networks:
      - coffee_shop_network
    env_file:
      - ./db/.env.dev

networks:
  coffee_shop_network:
    driver: bridge
